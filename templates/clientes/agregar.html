{% extends "base.html" %}
{% block title %}Nuevo Cliente — PERNO TODO{% endblock %}
{% block page_title %}<i class="bi bi-person-plus me-2" style="color:var(--acc)"></i>Nuevo Cliente{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h2 style="font-size:1.4rem;font-weight:800;color:var(--txt);margin:0">Registrar Cliente</h2>
    <p style="color:var(--muted);font-size:.82rem;margin:3px 0 0">Agregar nuevo cliente al sistema</p>
  </div>
  <a href="{{ url_for('listar_clientes') }}"
     style="background:var(--card2);border:1px solid var(--bdr);border-radius:9px;color:var(--txt);padding:8px 14px;font-size:.83rem;font-weight:600;text-decoration:none">
    <i class="bi bi-arrow-left me-1"></i>Volver
  </a>
</div>

<div class="row justify-content-center">
<div class="col-md-8">
<div style="background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:24px">
  <form method="POST" action="{{ url_for('agregar_cliente') }}">
    <div class="row g-3">
      <div class="col-md-4">
        <label style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);display:block;margin-bottom:4px">Cédula / RUC <span style="color:var(--err)">*</span></label>
        <input type="text" name="cedula" maxlength="13" required
               style="width:100%;padding:9px 12px;background:var(--card2);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:.88rem;outline:none"
               value="{{ form_data.cedula if form_data else '' }}" autofocus>
      </div>
      <div class="col-md-4">
        <label style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);display:block;margin-bottom:4px">Nombres <span style="color:var(--err)">*</span></label>
        <input type="text" name="nombres" required
               style="width:100%;padding:9px 12px;background:var(--card2);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:.88rem;outline:none"
               value="{{ form_data.nombres if form_data else '' }}">
      </div>
      <div class="col-md-4">
        <label style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);display:block;margin-bottom:4px">Apellidos <span style="color:var(--err)">*</span></label>
        <input type="text" name="apellidos" required
               style="width:100%;padding:9px 12px;background:var(--card2);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:.88rem;outline:none"
               value="{{ form_data.apellidos if form_data else '' }}">
      </div>
      <div class="col-md-4">
        <label style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);display:block;margin-bottom:4px">Teléfono</label>
        <input type="text" name="telefono"
               style="width:100%;padding:9px 12px;background:var(--card2);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:.88rem;outline:none"
               placeholder="0999..." value="{{ form_data.telefono if form_data else '' }}">
      </div>
      <div class="col-md-4">
        <label style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);display:block;margin-bottom:4px">Email</label>
        <input type="email" name="email"
               style="width:100%;padding:9px 12px;background:var(--card2);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:.88rem;outline:none"
               value="{{ form_data.email if form_data else '' }}">
      </div>
      <div class="col-md-4">
        <label style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);display:block;margin-bottom:4px">Tipo</label>
        <select name="tipo"
                style="width:100%;padding:9px 12px;background:var(--card2);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:.88rem;outline:none">
          <option value="minorista" {% if not form_data or form_data.tipo=='minorista' %}selected{% endif %}>Minorista</option>
          <option value="mayorista" {% if form_data and form_data.tipo=='mayorista' %}selected{% endif %}>Mayorista</option>
        </select>
      </div>
      <div class="col-12">
        <label style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);display:block;margin-bottom:4px">Dirección</label>
        <input type="text" name="direccion"
               style="width:100%;padding:9px 12px;background:var(--card2);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:.88rem;outline:none"
               value="{{ form_data.direccion if form_data else '' }}">
      </div>
    </div>
    <div class="d-flex gap-2 mt-4">
      <button type="submit"
              style="background:var(--acc);border:none;border-radius:9px;color:#fff;padding:10px 22px;font-size:.9rem;font-weight:700;cursor:pointer">
        <i class="bi bi-check-circle me-2"></i>Guardar Cliente
      </button>
      <a href="{{ url_for('listar_clientes') }}"
         style="background:var(--card2);border:1px solid var(--bdr);border-radius:9px;color:var(--txt);padding:10px 16px;font-size:.88rem;font-weight:600;text-decoration:none">
        Cancelar
      </a>
    </div>
  </form>
</div>
</div>
</div>
{% endblock %}
