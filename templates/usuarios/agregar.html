{% extends "base.html" %}
{% block title %}Nuevo Usuario{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-5">
<div class="card">
    <div class="card-header bg-primary text-white">
        <i class="bi bi-person-plus"></i> Crear Nuevo Usuario
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Nombre Completo <span class="text-danger">*</span></label>
                <input type="text" name="nombre" class="form-control" required
                       value="{{ form_data.nombre if form_data else '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Email <span class="text-danger">*</span></label>
                <input type="email" name="email" class="form-control" required
                       value="{{ form_data.email if form_data else '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña <span class="text-danger">*</span></label>
                <input type="password" name="password" class="form-control"
                       minlength="6" required placeholder="Mínimo 6 caracteres">
            </div>
            <div class="mb-3">
                <label class="form-label">Rol <span class="text-danger">*</span></label>
                <select name="role" class="form-select" required>
                    {% for r in roles %}
                    <option value="{{ r }}"
                        {% if form_data and form_data.role == r %}selected{% endif %}>
                        {{ r }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i> Crear Usuario
                </button>
                <a href="{{ url_for('listar_usuarios') }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
</div>
</div>
{% endblock %}
