{% extends "base.html" %}
{% block title %}Nuevo Proveedor — PERNO TODO{% endblock %}
{% block page_title %}<i class="bi bi-truck me-2" style="color:var(--ok)"></i>Nuevo Proveedor{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h2 style="font-size:1.4rem;font-weight:800;color:var(--txt);margin:0">Registrar Proveedor</h2>
    <p style="color:var(--muted);font-size:.82rem;margin:3px 0 0">Agregar nuevo proveedor al sistema</p>
  </div>
  <a href="{{ url_for('listar_proveedores') }}"
     style="background:var(--card2);border:1px solid var(--bdr);border-radius:9px;color:var(--txt);padding:8px 14px;font-size:.83rem;font-weight:600;text-decoration:none">
    <i class="bi bi-arrow-left me-1"></i>Volver
  </a>
</div>

<div class="row justify-content-center">
<div class="col-md-8">
<div style="background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:24px">
  <form method="POST" action="{{ url_for('agregar_proveedor') }}">
    <div class="row g-3">
      <div class="col-md-4">
        <label style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);display:block;margin-bottom:4px">RUC <span style="color:var(--err)">*</span></label>
        <input type="text" name="ruc" maxlength="13" required
               style="width:100%;padding:9px 12px;background:var(--card2);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:.88rem;outline:none"
               placeholder="Ej: 1790012345001"
               value="{{ form_data.ruc if form_data else '' }}">
      </div>
      <div class="col-md-8">
        <label style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);display:block;margin-bottom:4px">Nombre de la Empresa <span style="color:var(--err)">*</span></label>
        <input type="text" name="nombre_empresa" required
               style="width:100%;padding:9px 12px;background:var(--card2);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:.88rem;outline:none"
               value="{{ form_data.nombre_empresa if form_data else '' }}">
      </div>
      <div class="col-md-6">
        <label style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);display:block;margin-bottom:4px">Persona de Contacto <span style="color:var(--err)">*</span></label>
        <input type="text" name="contacto" required
               style="width:100%;padding:9px 12px;background:var(--card2);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:.88rem;outline:none"
               value="{{ form_data.contacto if form_data else '' }}">
      </div>
      <div class="col-md-6">
        <label style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);display:block;margin-bottom:4px">Teléfono <span style="color:var(--err)">*</span></label>
        <input type="text" name="telefono" required
               style="width:100%;padding:9px 12px;background:var(--card2);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:.88rem;outline:none"
               placeholder="Ej: 0987654321"
               value="{{ form_data.telefono if form_data else '' }}">
      </div>
      <div class="col-md-6">
        <label style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);display:block;margin-bottom:4px">Email</label>
        <input type="email" name="email"
               style="width:100%;padding:9px 12px;background:var(--card2);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:.88rem;outline:none"
               value="{{ form_data.email if form_data else '' }}">
      </div>
      <div class="col-md-6">
        <label style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);display:block;margin-bottom:4px">Dirección</label>
        <input type="text" name="direccion"
               style="width:100%;padding:9px 12px;background:var(--card2);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:.88rem;outline:none"
               value="{{ form_data.direccion if form_data else '' }}">
      </div>
    </div>
    <div class="d-flex gap-2 mt-4">
      <button type="submit"
              style="background:var(--ok);border:none;border-radius:9px;color:#fff;padding:10px 22px;font-size:.9rem;font-weight:700;cursor:pointer">
        <i class="bi bi-check-circle me-2"></i>Guardar Proveedor
      </button>
      <a href="{{ url_for('listar_proveedores') }}"
         style="background:var(--card2);border:1px solid var(--bdr);border-radius:9px;color:var(--txt);padding:10px 16px;font-size:.88rem;font-weight:600;text-decoration:none">
        Cancelar
      </a>
    </div>
  </form>
</div>
</div>
</div>
{% endblock %}
