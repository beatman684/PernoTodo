{% extends "base.html" %}
{% block title %}404 — No encontrado{% endblock %}
{% block content %}
<div style="text-align:center;padding:80px 20px">
  <div style="font-size:5rem;font-weight:900;color:var(--acc)">404</div>
  <h2 style="font-size:1.5rem;font-weight:700;color:var(--txt);margin:8px 0">Página no encontrada</h2>
  <p style="color:var(--muted);margin-bottom:24px">La página que buscas no existe o fue movida.</p>
  <a href="{{ url_for('dashboard') }}"
     style="background:var(--acc);border:none;border-radius:9px;color:#fff;padding:10px 24px;font-size:.9rem;font-weight:700;text-decoration:none">
    <i class="bi bi-house me-2"></i>Volver al inicio
  </a>
</div>
{% endblock %}
